# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    pull-request-branch-name:
      separator: '-' # Use hyphens to separate branch name segments
    schedule:
      interval: 'monthly'
    ignore:
      # muted 2026-09-18 — pinned to the .nvmrc Node major (24, the only Active LTS).
      # 25.x/26.x run ahead of the runtime. Unmute when Node 26 reaches LTS (~Oct 2026)
      # and .nvmrc moves. Dashboard #67
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      minor-updates:
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'
  - package-ecosystem: 'github-actions' # Check for updates to GitHub Actions every week
    directory: '/'
    pull-request-branch-name:
      separator: '-'
    schedule:
      interval: 'monthly'
    groups:
      minor-updates:
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'
